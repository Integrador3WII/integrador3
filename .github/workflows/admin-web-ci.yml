name: Admin web CI

on:
  pull_request:
    paths:
      - 'apps/admin-web/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-web-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/admin-web/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-web-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck:admin
      - name: Unit tests
        run: npm run test:admin
      - name: Isolated PostgreSQL contract tests
        run: npm --workspace apps/admin-web run test:db
      - name: Production build
        run: npm run build:admin
